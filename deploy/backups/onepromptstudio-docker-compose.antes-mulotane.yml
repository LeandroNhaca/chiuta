# Projecto Docker "onepromptstudio" no VPS 2042157. Gerado por scripts/gerar-compose.mjs (não editar à mão).
# Serve /srv/prod (main) e /srv/preview (branch de pré-visualização) do volume ops_site.
# Mantém os volumes caddy_data/caddy_config, por isso os certificados actuais são reaproveitados.
# É o único contentor com portas públicas. Os outros serviços (n8n, Uptime Kuma) ligam-se à rede "edge"
# e o Caddy chega-lhes por dentro. Corre como root dentro do contentor só com NET_BIND_SERVICE
# (portas 80 e 443), disco só de leitura e limites de memória e CPU.
# caddy.env (só no servidor, 600 root): KUMA_USER e KUMA_HASH da password à frente do Uptime Kuma.
services:
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2.11.7-builder-alpine AS build
        RUN xcaddy build v2.11.7 --with github.com/mholt/caddy-ratelimit@v0.1.1-0.20260612195517-5625512f24f6
        FROM caddy:2.11.7-alpine
        COPY --from=build /usr/bin/caddy /usr/bin/caddy
    image: onepromptstudio/caddy:2.11.7-ratelimit
    pull_policy: never
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: /root/.config/onepromptstudio/caddy.env
    environment:
      ACME_EMAIL: contacto@onepromptstudio.com
      HSTS_MAX_AGE: "31536000"
      N8N_ORIGIN: https://n8n.onepromptstudio.com
      ANALYTICS_ORIGIN: ""
      CADDYFILE: 
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo $$CADDYFILE | base64 -d | gunzip > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    networks: [default, edge]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ops_site:/srv:ro
networks:
  edge: { name: edge }
volumes:
  caddy_data:
  caddy_config:
  ops_site:
    external: true
