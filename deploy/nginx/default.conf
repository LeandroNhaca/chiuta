# Mulotane Lodge · servidor estático (nginx sem privilégios, porta 8080, disco só de leitura).
# O HTTPS, o certificado e a compressão ficam no reverse proxy (Caddy) que encaminha para este contentor.

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Redireccionamentos relativos (/alojamento -> /alojamento/), sem expor a porta interna.
    absolute_redirect off;
    client_max_body_size 64k;

    include /etc/nginx/seguranca.inc;

    # O site é estático: só leitura.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ficheiros com hash no nome: cache de um ano.
    location /_astro/ {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fotografias, fontes e imagem de partilha: 30 dias.
    location ~ ^/(images|fonts|og)/ {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # HTML e restantes: revalidar sempre, para cada publicação aparecer logo.
    location / {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/seguranca.inc;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
